# Obtenha a nova interface personalizada texturizada aqui: https://builtbybit.com/resources/playerwarps-custom-ui.51704/
#
# Se você tiver alguma dúvida, entre em https://discord.gg/TfUC8uJ para obter ajuda
#
# A partir da versão 1.16 você também pode usar cores HEX.
# Em vez do formato &f, use <#ffffff>
#
config:
  debug: false
  language: Portuguese
  # Como os jogadores digitam os valores (nome do warp, descrição, senha, ...)
  # CHAT  - o jogador digita o valor no chat
  # SIGN  - o jogador digita o valor em uma interface de placa (Sign GUI)
  # MODAL - o jogador digita o valor em uma janela de diálogo (Modal)
  #         (requer Minecraft 1.21.6+ e Paper ou algum fork do Paper, caso contrário CHAT será usado)
  input-mode: CHAT
  update-checker: true
  autosave-enabled: true # configuração recomendada como true
  autosave-announce: true
  date-format: dd/MM/yyyy
  warp-name-format: "&b&n%warpName%"

  #demand-verification: false

  # Recomenda-se 30 minutos
  autosave-interval: 30 # em minutos
  teleport-delay: 3
  currency-symbol: "$"
  allow-colors-in-warp-display-names: true
  sort-by:
    - ALPHABETICAL
    - VISITS
    - LATEST
    - RATING

  # integrações (hooks)
  placeholder-api-hook-enabled: true
  dynmap-hook-enabled: true
  bluemap-hook-enabled: true
  angeschossen-lands-hook-enabled: true
  territory-hook-enabled: true
  grief-prevention-hook-enabled: true
  head-database-hook-enabled: true
  essentials-hook-enabled: true
  items-adder-hook-enabled: true
  oraxen-hook-enabled: true
  residence-hook-enabled: true
  superior-sky-block-hook-enabled: true
  vault-hook-enabled: true
  world-guard-hook-enabled: true
  bentobox-hook-enabled: true
  towny-advanced-hook-enabled: true


  selected-sort: "&a ►"
  other-sort: "&7  "

  # Todos os ícones podem ser encontrados aqui: https://github.com/webbukkit/dynmap/wiki/Using-Markers
  dynmap-enabled: true
  dynmap-marker-icon: "blueflag"
  dynmap-marker-label: "Warp: %warp% por %owner%"

  warp-description-color: "&9"

  #
  warp-creation-for-trusted-players: true

  # Seção de Preços
  # Escolha entre os modelos de preço FREE (Gratuito), FIXED (Fixo) ou CUSTOM (Personalizado).
  free-warps: 1
  warp-pricing: CUSTOM
  warp-fixed-price: 100000  # O preço por criação de warp quando o preço FIXED é usado.
  warp-custom-price: "100000 + ({amount} * 20000)"  # Fórmula de preço personalizada para criar warps.

  max-featured-warps: 5
  feature-warp-duration: 4320 # Em minutos

  # Para desativar as taxas de recursos, defina-as como 0
  # Esta opção funciona apenas com o plugin Vault instalado
  feature-warp-fee: 2000
  relocate-warp-fee: 1000
  rename-warp-fee: 500
  transfer-ownership-fee: 0
  set-status-fee: 0
  set-type-fee: 0
  set-preview-item-fee: 0
  set-description-fee: 0
  set-description-characters-limit: 32
  set-display-name-fee: 200
  set-admission-fee: 0
  # Para desativar o reembolso, defina como 0
  delete-warp-refund: 2000
  max-warp-admission: 100000
  # Certifique-se de usar IDs válidos
  default-warp-item: ENDER_PEARL
  # Pode ser: OPENED, CLOSED
  default-warp-status: OPENED
  banned-items:
    - DEBUG_STICK
    - BARRIER
    - STRUCTURE_VOID
  default-limit-size: 1
  warp-name-max-length: 24
  disabled-worlds:
    - disabledworld1
    - disabledworld2
    - disabledworld3
  enabled-regions: # Regiões do World Guard
    - enabledregion1
    - enabledregion2
    - enabledregion3

  enable-hints: true
  enable-categories: true
  enable-warp-search: true
  enable-warp-rating: true

  warp-visit-notification: false
  warp-creation-notification: false

  # Esta opção avisa ao jogador que o teletransporte do warp é cobrado
  allow-teleport-accept-menu: true
  # Verifica se o destino do warp é seguro (fogo, lava, queda de altura ou do mundo)
  check-for-safe-teleport: false

  next-page-item: ARROW
  previous-page-item: ARROW

  no-warp-found-item: BARRIER
  free-feature-position-item: OAK_BUTTON

  confirm-item: LIME_STAINED_GLASS_PANE
  deny-item: RED_STAINED_GLASS_PANE
  insufficient-permissions-item: BARRIER
  warp-list-item: PAPER
  sort-warps-item: REPEATER
  search-warp-item: OAK_SIGN
  help-item: REDSTONE_TORCH
  my-warps-item: REPEATER
  favorite-warps-item: NAME_TAG
  page-item: ARROW
  star-review-item: SUNFLOWER
  back-item: OAK_BUTTON
  # Itens do menu de configurações
  set-price-item: SUNFLOWER
  set-category-item: WHITE_BANNER
  change-display-name-item: WRITABLE_BOOK
  change-preview-item: ITEM_FRAME
  change-description-item: NAME_TAG
  change-accessibility-item: IRON_DOOR
  rename-warp-item: OAK_SIGN
  remove-warp-item: BARRIER
  relocate-warp-item: WHITE_BANNER
  change-owner-item: PLAYER_HEAD
  blocked-players-item: SHIELD

  # Para remover um item do menu, defina
  # sua posição como -1
  warp-overview-position: 4
  set-price-position: 11
  set-category-position: 12
  change-display-name-position: 13
  change-preview-item-position: 14
  change-description-position: 15
  change-accessibility-position: 22
  remove-warp-position: 38
  rename-warp-position: 39
  relocate-warp-position: 41
  change-owner-position: 42
  blocked-players-position: 40

  confirm-item-positions:
    - 10
    - 11
    - 12

  deny-item-positions:
    - 14
    - 15
    - 16